<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>kinou</title>
<!-- Bande envoyée à un producteur (Gus 19/11 ; 2e version 22/11) : composée dans la bibliothèque de l'admin. Adresse b/<code>
     (lien court, réécrit par _redirects sur Cloudflare, par 404.html sur GitHub Pages) ou b/?<code>.
     Données CHIFFRÉES dans data/b/<empreinte>.json du dépôt admin : PBKDF2-SHA256 (150 000 tours) du code → nom du fichier + clé
     AES-GCM ; avec un mot de passe, clé tirée de « code + mot de passe ». Même calcul que bandSeal dans l'admin.
     Anciennes bandes (19/11, en clair) : data/bandes/<code>.json.
     Mise en page reprise des pages des chefs op du site : nom en grand (lien vers sa page), voile lumineux et fond flouté au
     survol, grille 16:9, lecteur plein écran, « See more projects ». Page indépendante du reste du site. -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
<style>
  :root { --kinou-bg: #000; --kinou-fg: #FFFCEB; --dim: rgba(255,252,235,.55); --faint: rgba(255,252,235,.18); --kinou-sans: "Satoshi", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html { background: var(--kinou-bg); scrollbar-gutter: stable; }
  body { margin: 0; background: var(--kinou-bg); color: var(--kinou-fg); font-family: var(--kinou-sans); font-weight: 400; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  /* Fonds au survol : image du film très floutée et assombrie, puis son extrait */
  #projbg, #projvid { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .45s ease; pointer-events: none; transform: scale(1.15); }
  #projbg { background: center / cover no-repeat; filter: blur(30px) brightness(.45); }
  #projvid { object-fit: cover; filter: blur(30px) brightness(.4); }
  body.proj-on #projbg, body.proj-on #projvid.on { opacity: 1; }
  #app { position: relative; z-index: 1; }
  /* En-tête */
  header { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: calc(env(safe-area-inset-top, 0px) + 28px) 32px 0; }
  header .bt { display: flex; align-items: center; gap: 18px; min-width: 0; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--kinou-fg); }
  header .bt > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .nav { justify-self: end; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; transition: opacity .2s; }
  header .nav:hover { opacity: .6; }
  .logo { justify-self: center; font-weight: 600; font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
  .logo img { display: block; height: 30px; width: auto; }
  /* Nom du chef op, en grand à droite (comme sur sa page) */
  .hero { margin: 26px 32px 0; white-space: nowrap; overflow: hidden; text-align: right; font-weight: 600; font-size: clamp(30px, 5vw, 84px); letter-spacing: -0.04em; line-height: 1; animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
  .hero a { display: inline-block; transition: opacity .2s; }
  .hero a:hover { opacity: .75; }
  .hero .amp { opacity: .5; }
  .wrap { display: grid; grid-template-columns: 208px 1fr; gap: 0; padding: 40px 32px 0; }
  .wrap.full { grid-template-columns: 1fr; } .wrap.full .side { display: none; } /* pas de sections : toute la largeur (Gus 22/11) */
  .side { position: sticky; top: 28px; align-self: start; padding-right: 24px; }
  .side .cats { display: flex; flex-direction: column; gap: 10px; }
  .side .cats button { padding: 0; border: 0; background: none; color: var(--kinou-fg); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; text-align: left; opacity: .4; cursor: pointer; transition: opacity .2s; }
  .side .cats button:hover { opacity: .8; }
  .side .cats button.on { opacity: 1; }
  .desc { margin: 0 0 28px; max-width: 560px; color: rgba(255,252,235,.85); font-size: 16px; line-height: 1.55; white-space: pre-line; animation: rise .7s .2s cubic-bezier(.2, .7, .2, 1) both; }
  .dlall { flex: none; display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; background: none; color: var(--kinou-fg); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; opacity: .7; transition: opacity .2s; }
  .dlall:disabled { opacity: .35; cursor: default; }
  .dlall:hover { opacity: 1; }
  .dlall svg { width: 15px; height: 15px; }
  .dlmsg { position: fixed; z-index: 9; left: 32px; bottom: 24px; max-width: min(440px, calc(100vw - 64px)); padding: 12px 16px; background: rgba(20,20,20,.92); border: 1px solid var(--faint); color: rgba(255,252,235,.85); font-size: 12px; line-height: 1.5; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: rise .4s ease both; }
  .dlmsg .bar { height: 2px; margin-top: 8px; background: var(--faint); } .dlmsg .bar i { display: block; height: 100%; width: 0; background: var(--kinou-fg); transition: width .3s; }
  .sec { margin: 72px 0 18px; padding-top: 26px; border-top: 1px solid var(--faint); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; scroll-margin-top: 30px; } /* sections : séparateur + espace (Gus 22/11) */
  main > .sec:first-child, .desc + .sec { margin-top: 0; padding-top: 0; border-top: 0; }
  .sec.blank { margin: 64px 0 64px; padding: 0; }
  main > .sec.blank:first-child, .desc + .sec.blank { margin: 0; }
  /* Grille : la dernière ligne incomplète est centrée (Gus 24/11) ; 2 colonnes moins larges que l'écran, 1 colonne encore moins. */
  .grid { --cols: 3; --gap: 6px; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); margin: 0 auto; }
  .grid > .card { flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
  .grid.c2 { --cols: 2; max-width: 1240px; }
  .grid.c1 { --cols: 1; --gap: 64px; max-width: 1040px; }
  .card { position: relative; overflow: hidden; aspect-ratio: 16 / 9; cursor: pointer; animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 70ms + 200ms); }
  .still { position: absolute; inset: 0; overflow: hidden; background: #0c0c0c; transition: transform .6s ease; }
  .card:hover .still { transform: scale(1.05); }
  .still .in { position: absolute; inset: 0; background: center / cover no-repeat; }
  .still video { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); object-fit: cover; opacity: 0; transition: opacity .2s ease; }
  .still video.on { opacity: 1; }
  /* Voile lumineux au survol (comme sur le site) */
  .still::after { content: ""; position: absolute; inset: 0; background: var(--kinou-fg); opacity: 0; pointer-events: none; }
  .card:hover .still::after { animation: glow 1.25s ease-out; }
  @keyframes glow { 0% { opacity: 0; } 20% { opacity: .1; } 100% { opacity: 0; } }
  @media (hover: none) and (max-width: 700px) { .still::after { display: none; } } /* pas de voile lumineux sur téléphone (Gus 24/11) */
  .meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; padding: 36px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.78)); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .card:hover .meta { opacity: 1; }
  .meta h3 { margin: 0; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; line-height: 1.2; }
  .meta .ty { font-weight: 600; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,252,235,.6); white-space: nowrap; }
  .meta .n { font-size: 11px; color: var(--dim); }
  @media (hover: none) { .meta { opacity: 1; } }
  .more { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 40px; padding: 90px 32px 30px; }
  .more a { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .more a::before, .more a::after { display: inline-block; font-weight: 300; transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
  .more a::before { content: "["; margin-right: .5em; } .more a::after { content: "]"; margin-left: .5em; }
  .more a:hover::before { transform: translateX(-6px); } .more a:hover::after { transform: translateX(6px); }
  footer { padding: 40px 24px 50px; text-align: center; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  footer .logo { display: inline-block; font-size: 26px; letter-spacing: -0.03em; text-transform: none; color: var(--kinou-fg); margin-bottom: 12px; }
  footer .soc a { margin: 0 8px; transition: opacity .2s; } footer .soc a:hover { opacity: .6; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .side { position: static; padding: 0 0 18px; } .side .cats { flex-direction: row; flex-wrap: wrap; gap: 8px 18px; } .grid.c3 { --cols: 2; } }
  @media (max-width: 560px) { header { padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 0; grid-template-columns: 1fr auto; } header .bt { display: none; } header .bt:has(.dlall) { display: flex; grid-column: 1 / -1; order: 3; } header .logo { justify-self: start; font-size: 26px; } .hero { margin: 28px 20px 0; font-size: clamp(28px, 9vw, 44px); } .wrap { padding: 28px 10px 0; } .grid, .grid.c2, .grid.c3 { --cols: 1; --gap: 10px; } .desc { padding: 0 10px; } .sec { margin-left: 10px; } .dlmsg { left: 12px; right: 12px; bottom: 12px; max-width: none; } .side { padding: 0 10px 14px; } }
  /* Messages (mot de passe, lien invalide) */
  .msg { max-width: 420px; margin: 18vh auto; padding: 0 24px; text-align: center; color: var(--dim); line-height: 1.6; animation: rise .6s ease both; }
  .msg .logo { display: block; margin-bottom: 40px; color: var(--kinou-fg); font-size: 30px; }
  .msg h1 { margin: 0 0 6px; color: var(--kinou-fg); font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
  .msg input { display: block; width: 100%; margin: 26px 0 14px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--faint); background: none; color: var(--kinou-fg); font: 400 18px var(--kinou-sans); text-align: center; outline: none; transition: border-color .2s; }
  .msg input:focus { border-color: var(--kinou-fg); }
  .msg .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .btn { display: inline-block; padding: 10px 22px; border: 1px solid var(--faint); background: none; color: var(--kinou-fg); font: 600 11px var(--kinou-sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: border-color .2s; }
  .btn:hover { border-color: var(--kinou-fg); }
  .wait { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--faint); border-top-color: var(--kinou-fg); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Lecteur : repris du site (assets/css/main.css, #player / #pglass / .plight), verre dépoli derrière, clic dans le vide = fermer */
  #pglass { position: fixed; inset: 0; z-index: 8; background: rgba(8,8,8,.62); -webkit-backdrop-filter: blur(36px) saturate(1.5); backdrop-filter: blur(36px) saturate(1.5); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s ease, visibility .35s; }
  #pglass.on { opacity: 1; visibility: visible; }
  #player { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; padding: 56px 32px 24px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; background: transparent; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
  #player::-webkit-scrollbar { display: none; }
  #player.on { opacity: 1; visibility: visible; }
  #player .pin { --pw: min(100%, 1400px, calc((100vh - 220px) * 16 / 9)); width: var(--pw); margin: auto 0; flex: none; }
  #player.has-stills .pin { --pw: min(100%, 1400px, calc((100vh - 290px) * 16 / 9)); margin: 0; }
  #player .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  #player .ptitle { margin: 0 0 14px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  #player .phead .ptitle { margin: 0; }
  #player .pstage { width: 100%; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; }
  #player .pstage video { display: block; width: 100%; height: 100%; object-fit: contain; background: transparent; }
  #player .pcap { margin-top: 18px; display: flow-root; }
  #player .ptypes { float: right; margin-left: 16px; font-size: 11px; line-height: 1.7; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,252,235,.6); }
  #player .pcap p { margin: 0; white-space: pre-line; font-size: 11px; line-height: 1.7; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,252,235,.55); }
  #player .pcap p a { transition: opacity .2s; } #player .pcap p a:hover { opacity: .7; }
  #player .pdl { flex: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; transition: opacity .2s; }
  #player .pdl:hover { opacity: 1; }
  #player .pdl svg { width: 14px; height: 14px; }
  #player .pclose { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 20px); right: 28px; width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--kinou-fg); cursor: pointer; opacity: .7; transition: opacity .2s; }
  #player .pclose:hover { opacity: 1; }
  #player .parrow { width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--kinou-fg); line-height: 0; cursor: pointer; opacity: .6; transition: opacity .2s; display: inline-flex; align-items: center; justify-content: center; }
  #player .parrow:hover { opacity: 1; }
  #player .pnav .parrow { position: fixed; z-index: 2; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  #player .pnav .l, #player .plight .l { left: 24px; } #player .pnav .r, #player .plight .r { right: 24px; }
  #player .pgal { display: none; flex: none; flex-direction: column; align-items: center; gap: 32px; width: min(100%, 1800px); margin-top: 64px; padding-bottom: 22vh; }
  #player.has-stills .pgal { display: flex; }
  #player .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; width: 100%; }
  #player .pgal button { aspect-ratio: 16 / 9; padding: 0; border: 0; background: #070707 center / cover no-repeat; cursor: zoom-in; opacity: 0; }
  #player .pgal button.cr { position: relative; overflow: hidden; aspect-ratio: var(--sar); align-self: start; }
  #player .pgal button.cr i, #player .plight .plcr i { position: absolute; inset: 0; background: center / cover no-repeat; background-size: var(--bsz, cover); background-position: var(--bpos, var(--sx, 50%) var(--sy, 50%)); transform: scale(var(--sz, 1)); transform-origin: var(--sx, 50%) var(--sy, 50%); }
  #player .plight .plcr { position: relative; overflow: hidden; aspect-ratio: var(--sar); width: min(100%, calc((100vh - 112px) * var(--sar))); }
  #player .pgal button.shown { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 70ms); }
  #player .pxv { width: min(100%, 1400px, calc((100vh - 290px) * 16 / 9)); opacity: 0; }
  #player .pxv.shown { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }
  #player .pxv video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: contain; }
  #player.nostage .pstage { display: none; }
  #player.nostage .pin { --pw: min(100%, 1800px); }
  #player.nostage .pgal { margin-top: 40px; }
  #player .pfade { display: none; position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: 22vh; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.15) 30%, rgba(0,0,0,.4) 65%, rgba(0,0,0,.6) 100%); }
  #player.has-stills .pfade { display: block; }
  #player .plight { position: fixed; z-index: 2; inset: 0; display: flex; align-items: center; justify-content: center; padding: 56px 32px; background: rgba(0,0,0,.98); cursor: zoom-out; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s; }
  #player .plight.on { opacity: 1; visibility: visible; }
  #player .plight img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  #player .plight .parrow { position: absolute; z-index: 1; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: none; }
  #player .plight.multi .parrow { display: inline-flex; }
  #player .plight .plwrap { display: flex; flex-direction: column; align-items: stretch; width: fit-content; max-width: 100%; }
  #player .plight .plwrap > img { display: block; max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; }
  #player .plight .plwrap > .plcr { width: min(calc(100vw - 64px), calc((100vh - 190px) * var(--sar))); }
  #player .plight .plnav { display: flex; justify-content: space-between; margin-top: 8px; }
  #player .plight .plnav .parrow { position: static; display: inline-flex; width: 48px; height: 48px; opacity: .9; }
  #player .plight .plnav .parrow:hover { opacity: 1; }
  #player .plight .plnav .parrow svg { width: 32px; height: 32px; stroke-width: 1.8; }
  @media (max-width: 560px) { #player .plight .plwrap > .plcr { width: min(100vw, calc((100vh - 190px) * var(--sar))); } }
  /* Prix groupés par festival (comme sur le site) */
  #player .pi-awards { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.75; color: var(--kinou-fg); }
  #player .pi-awards li.aw { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  #player .pi-awards li.aw + li.aw { margin-top: 14px; }
  #player .pi-awards .aw-fest { font-size: 10.5px; line-height: 1.6; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,252,235,.5); margin-bottom: 2px; }
  #player .pi-awards .aw-fest i { font-style: normal; margin-left: .7em; color: rgba(255,252,235,.35); }
  #player .pi-awards .aw-it { line-height: 1.55; }
  #player .pi-awards .aw-it.win { font-weight: 500; }
  #player .pi-awards .aw-it.nom, #player .pi-awards .aw-it.sel { color: rgba(255,252,235,.68); }
  #player .pi-awards .aw-it b { font-weight: 500; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,252,235,.45); margin-right: .8em; }
  #player .pcap .pi-awards.pi-up { float: right; clear: right; max-width: 62%; margin: 0 0 0 32px; text-align: right; }
  @media (max-width: 900px), (hover: none) and (pointer: coarse) { #player .pi-awards { margin-top: 18px; } #player .pi-awards li.aw { align-items: flex-start; } }
  @media (max-width: 560px) { #player { padding-left: 16px; padding-right: 16px; } #player .pgal { gap: 8px; margin-top: 40px; } #player .pxv { margin: 16px 0; } #player .pgrid { grid-template-columns: repeat(2, 1fr); gap: 8px; } #player .plight { padding: 56px 0; } }
  @media (max-width: 700px) { #player:not(.has-stills) .pin { margin: 12vh 0 auto; } }
  /* Film partagé seul : le lecteur dans la page, au centre, sans croix ni fond flouté */
  #player.single { position: relative; inset: auto; z-index: 1; min-height: calc(100vh - 100px); overflow: visible; padding-top: 32px; opacity: 1; visibility: visible; animation: rise .7s cubic-bezier(.2, .7, .2, 1) backwards; }
  #player.single:not(.has-stills) .pin { margin: auto 0; }
  #player.single .pfade { display: none; }
  #player.single .pgal { padding-bottom: 6vh; }
  .bdesc { margin: 24px 32px 0; }
  /* « Plein écran en haut » (Gus 24/11, comme le Full Bleed de Slate) : le film en grand, son extrait qui joue, titre et crédits dessus. */
  .bleed { position: relative; height: min(80vh, 56.25vw); margin: 30px 0 0; overflow: hidden; background: #0b0b0b center / cover no-repeat; cursor: pointer; animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }
  @media (hover: none) { .card { transform-origin: 50% 50%; will-change: scale; } } /* téléphone : perspective réglée par pickFocus */
  .bleed .bl-bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  .bleed video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  .bleed video.on { opacity: 1; }
  .bleed::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.65)); pointer-events: none; }
  .bleed .bl-in { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; padding: 0 clamp(20px, 6vw, 120px) clamp(22px, 5vh, 54px); pointer-events: none; }
  .bleed h2 { margin: 0; max-width: 60%; font-weight: 600; font-size: clamp(26px, 3.6vw, 56px); letter-spacing: -0.03em; line-height: 1.05; }
  .bleed .bl-cr { display: flex; gap: 0 32px; text-align: center; }
  .bleed .bl-cr b { display: block; margin-bottom: 4px; font-weight: 700; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,252,235,.55); }
  .bleed .bl-cr span { font-size: 12px; }
  .bleed .bl-ar { position: absolute; z-index: 2; top: 50%; margin-top: -30px; width: 60px; height: 60px; padding: 0; border: 0; background: none; color: var(--kinou-fg); opacity: .7; cursor: pointer; transition: opacity .2s; }
  .bleed .bl-ar:hover { opacity: 1; } .bleed .bl-l { left: clamp(10px, 4vw, 60px); } .bleed .bl-r { right: clamp(10px, 4vw, 60px); }
