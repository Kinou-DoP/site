<!-- Bande envoyée à un producteur (Gus 19/11 ; 2e version 22/11) : composée dans la bibliothèque de l'admin. Adresse b/<code>
     (lien court, réécrit par _redirects sur Cloudflare, par 404.html sur GitHub Pages) ou b/?<code>.
     Données CHIFFRÉES dans data/b/<empreinte>.json du dépôt admin : PBKDF2-SHA256 (150 000 tours) du code → nom du fichier + clé
     AES-GCM ; avec un mot de passe, clé tirée de « code + mot de passe ». Même calcul que bandSeal dans l'admin.
     Anciennes bandes (19/11, en clair) : data/bandes/<code>.json.
     Mise en page reprise des pages des chefs op du site : nom en grand (lien vers sa page), voile lumineux et fond flouté au
     survol, grille 16:9, lecteur plein écran, « See more projects ». Page indépendante du reste du site. -->

<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
<style>
  :root { --kinou-bg: #000; --kinou-fg: #FFFCEB; --dim: rgba(255,252,235,.55); --faint: rgba(255,252,235,.18); --kinou-sans: "Satoshi", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }

  .dlmsg .bar { height: 2px; margin-top: 8px; background: var(--faint); } .dlmsg .bar i { display: block; height: 100%; width: 0; background: var(--kinou-fg); transition: width .3s; }
  .sec { margin: 72px 0 18px; padding-top: 26px; border-top: 1px solid var(--faint); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; scroll-margin-top: 30px; } /* sections : séparateur + espace (Gus 22/11) */

  @media (max-width: 560px) { header { padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 0; grid-template-columns: 1fr auto; } header .bt > span { display: none; } header .logo { justify-self: start; font-size: 26px; } .hero { margin: 28px 20px 0; font-size: clamp(28px, 9vw, 44px); } .wrap { padding: 28px 10px 0; } .grid { grid-template-columns: 1fr; gap: 10px; } .desc { padding: 0 10px; } .sec { margin-left: 10px; } .dlmsg { left: 12px; right: 12px; bottom: 12px; max-width: none; } .side { padding: 0 10px 14px; } }

  /* Lecteur plein écran (comme sur le site) */

  #player .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }

  #player .pclose:hover { opacity: 1; }
  #player .parrow { position: fixed; z-index: 3; top: 50%; width: 48px; height: 64px; margin-top: -32px; padding: 0; border: 0; background: none; color: var(--kinou-fg); cursor: pointer; opacity: .45; transition: opacity .2s; }

  #player .pgal.one { grid-template-columns: 1fr; } #player .pgal.one img { max-height: calc(100vh - 160px); object-fit: contain; cursor: zoom-out; }
  @media (max-width: 700px) { #player { padding: 56px 12px 24px; } #player .pgal { grid-template-columns: 1fr 1fr; gap: 8px; } #player .parrow { display: none; } #player .pcap { flex-direction: column; } #player .pr { text-align: left; } }

<script>
(function () {

  var FN = CF ? location.origin : "https://kinou-4tv.pages.dev"; // fonctions du site (téléchargement direct)
  // Code : /b/<code>, b/?<code> ou b/#<code>. Racine du site (liens vers les pages des chefs op) : ce qui précède « /b/ ».
  var pm = location.pathname.match(/^(.*\/)b\/([a-z0-9]+)\/?$/i);
  var ROOT = (pm ? pm[1] : location.pathname.replace(/b\/(index\.html)?$/, ""));

  var I_DL = '<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/>';

  // ---- Déchiffrement (même calcul que bandSeal dans l'admin) ----

      var f = r[0], ctx = { site: r[1] || {}, contact: r[2] || {}, dps: (r[3] && r[3].dps) || [] };

      });
      if (f.exp && today > f.exp) return msg("Bande expirée", "Cette bande n'est plus disponible. Contactez-nous pour en recevoir une nouvelle.");
      if (!f.pw) return open(f, key).then(function (d) { show(d, ctx); });

  function dlURL(it) { return FN + "/api/media?u=" + encodeURIComponent(it.full) + "&dl=" + encodeURIComponent((it.title || "kinou").trim()); }

  var DPS = []; // chefs op du site (liens du lecteur)
  function ctxDps() { return DPS; }

    document.title = (b.title || "Bande") + " — kinou";

    var logo = el("a", { class: "logo", href: ROOT }, [site.logo ? el("img", { src: RAW + site.logo, alt: "kinou" }) : "kinou"]);

    var bt = el("div", { class: "bt" }, [el("span", { text: b.title || "" }), dls.length > 1 ? el("button", { class: "dlall", on: { click: function (e) { zipAll(dls, b.title, e.currentTarget); } } }, [svg(I_DL), "Download all"]) : null]);
    app.appendChild(el("header", {}, [bt, logo, el("a", { class: "nav", href: ROOT + "cinematographers/", text: "cinematographers" })]));
    // Chefs op : ceux de la bande (réglages de l'admin, sinon détectés dans les films), chacun lié à sa page sur le site.
    var arts = (Array.isArray(b.artists) ? b.artists : String(b.artists || "").split(/\s*,\s*/)).filter(Boolean);
    if (!arts.length) (b.items || []).forEach(function (it) { (it.dops || []).forEach(function (d) { if (arts.indexOf(d) < 0) arts.push(d); }); });
